name: auto-build
permissions:
  contents: read

on:
  push:
    paths:
      - recipes/**
    branches:
      - main

jobs:
  list-apps:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skipci') && !contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip-ci') }}
    outputs:
      app_list: ${{ steps.find_changed_recipes.outputs.app_list }}
      experimental_app_list: ${{ steps.find_changed_recipes.outputs.experimental_app_list }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Find all recipe directories with changes
      id: find_changed_dirs
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
      with:
        files: "recipes/**"
        dir_names: "true"
        json: "true"
        escape_json: "false"
    - name: Filter down to changed recipes
      id: find_changed_recipes
      if: steps.find_changed_dirs.outputs.any_changed == 'true'
      env:
        CHANGED_PATHS: ${{ steps.find_changed_dirs.outputs.all_changed_files }}
      run: python3 .github/scripts/build_policy.py route "$CHANGED_PATHS" >> "$GITHUB_OUTPUT"

  build-apps:
    needs: list-apps
    # Only build-apps assumes the AWS role. Granting id-token here, not at workflow
    # level, stops list-apps (third-party action) from minting an OIDC token.
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.list-apps.outputs.app_list != '' && needs.list-apps.outputs.app_list != '[]' }}
    uses: ./.github/workflows/build-apps.yml
    with:
      applications: ${{ needs.list-apps.outputs.app_list }}
    secrets: inherit

  build-experimental:
    needs: list-apps
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.list-apps.outputs.experimental_app_list != '' && needs.list-apps.outputs.experimental_app_list != '[]' }}
    uses: ./.github/workflows/build-experimental-openrecon.yml
    with:
      applications: ${{ needs.list-apps.outputs.experimental_app_list }}
    secrets: inherit
