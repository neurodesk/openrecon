name: Validate JSON

on:
  pull_request:
    paths:
      - 'recipes/**/OpenReconLabel.json'
      - 'recipes/OpenReconSchema_*.json'
      - 'recipes/**/params.sh'
      - 'recipes/build.py'
      - 'recipes/build.sh'
      - 'tests/**'
      - '.github/scripts/*.py'
      - '.github/workflows/build-config.json'
      - '.github/workflows/auto-build.yml'
      - '.github/workflows/build-experimental-openrecon.yml'
      - '.github/workflows/validate-json.yml'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    name: Validate OpenReconLabel.json files
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          pip install jsonschema packaging
          
      - name: Test scanner metadata and image selection
        run: |
          python3 -m unittest discover -s tests -p test_openrecon_label_validation.py
          python3 -m unittest discover -s tests -p test_scanner_versions.py
          python3 -m unittest discover -s tests -p test_base_image_selection.py
          python3 -m unittest discover -s tests -p test_build_policy.py
          bash -n recipes/build.sh

      - name: Validate all recipe metadata and versions
        run: python3 .github/scripts/validate_recipes.py
