# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  # Do not post skipped-review status messages, which can also trigger emails.
  review_status: false
  auto_review:
    # These PRs are generated by neurocontainers CI to sync recipe metadata.
    ignore_title_keywords:
      - "OpenRecon metadata to"
